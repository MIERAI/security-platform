# Dimension 12: cloud security posture (AWS accounts, GCP projects, Azure subscriptions). Read from the `cloud`
# collector (any engine or native-service import; collectors/cloud/controls.py maps them onto these controls). Each
# control cites CIS Controls v8 (`cis`) and the CIS Foundations Benchmark sections per provider (`cis_benchmarks`:
# AWS v3.0, GCP v2.0, Azure v2.0); every finding also carries the benchmark references its engine reported.
# NOT APPLICABLE (excluded from every score, never a penalty) while the instance has no `cloud.accounts` and no
# collector covered a cloud asset (an import of a native posture service counts).
schema: security-platform/scorecard-catalog/v1
dimension:
  id: cloud
  order: 12
  title: Cloud security posture
  description: Every cloud account is scanned read-only and its network, resources, identities and data meet the CIS Foundations baseline.
  pillars: [network, device, people, software]
  applies_when: {any: [{instance: cloud.accounts}, {instance: cloud.imports}, {coverage_prefix: "cloud:"}]}
controls:
  # ---- coverage ---------------------------------------------------------------------------------------------------
  - id: cloud.accounts-scanned
    title: Every configured cloud account was authenticated and scanned (no coverage gap in the cloud collector)
    csf: ID.AM
    cis: ["1.1", "4.1"]
    pillars: [network, device, people, software]
    check: automated
    weight: 3
    source: {type: all, of: [
      {type: collector_fresh, collectors: [cloud], max_age: 2d},
      {type: metric, name: security_coverage_gaps_open, match: {collector: "^cloud$"}, agg: max, op: "<=", value: 0, absent: unknown}]}
  # ---- network ----------------------------------------------------------------------------------------------------
  - id: cloud.admin-ports-closed
    title: No firewall / security group / NSG allows SSH, RDP or all ports from the internet
    csf: PR.IR
    cis: ["4.4", "12.2"]
    cis_benchmarks: {aws: ["5.1", "5.2", "5.3"], gcp: ["3.6", "3.7"], azure: ["6.1", "6.2"]}
    pillars: [network]
    check: automated
    weight: 3
    source: {type: findings, check_in: [cloud.firewall_admin_port_open, cloud.firewall_open_to_internet], require_collector: cloud}
  - id: cloud.public-endpoints
    title: Resources with public addresses/endpoints are known and intended (none flagged)
    csf: PR.IR
    cis: ["4.4", "12.2"]
    pillars: [network]
    check: automated
    weight: 1
    source: {type: findings, check_in: [cloud.public_endpoint], require_collector: cloud}
  # ---- device / resource --------------------------------------------------------------------------------------------
  - id: cloud.volumes-encrypted
    title: Block volumes and snapshots are encrypted
    csf: PR.DS
    cis: ["3.11"]
    cis_benchmarks: {aws: ["2.2.1"], gcp: ["4.7"], azure: ["7.2"]}
    pillars: [device]
    check: automated
    weight: 2
    source: {type: findings, check_in: [cloud.volume_unencrypted], require_collector: cloud}
  - id: cloud.instances-patched
    title: Instances are under patch management with no missing updates; metadata service requires tokens
    csf: PR.PS
    cis: ["7.3", "7.4"]
    cis_benchmarks: {aws: ["5.6"]}
    pillars: [device]
    check: automated
    weight: 2
    source: {type: findings, check_in: [cloud.instance_unpatched, cloud.instance_metadata_v1], require_collector: cloud}
  # ---- people / identity ----------------------------------------------------------------------------------------------
  - id: cloud.mfa
    title: Every human cloud identity and the root / break-glass account has MFA
    csf: PR.AA
    cis: ["6.3", "6.5"]
    cis_benchmarks: {aws: ["1.5", "1.6", "1.10"], gcp: ["1.2"], azure: ["1.1.1", "1.1.2"]}
    pillars: [people]
    check: automated
    weight: 3
    source: {type: findings, check_in: [cloud.user_without_mfa, cloud.root_mfa_disabled], require_collector: cloud}
  - id: cloud.root-unused
    title: The root account has no access keys and is not used day to day
    csf: PR.AA
    cis: ["5.4"]
    cis_benchmarks: {aws: ["1.4", "1.7"]}
    pillars: [people]
    check: automated
    weight: 2
    source: {type: findings, check_in: [cloud.root_access_key, cloud.root_used], require_collector: cloud}
  - id: cloud.long-lived-keys
    title: No old, unused or user-managed long-lived keys (access keys, service-account keys)
    csf: PR.AA
    cis: ["5.3", "6.2"]
    cis_benchmarks: {aws: ["1.12", "1.14"], gcp: ["1.4", "1.7"]}
    pillars: [people]
    check: automated
    weight: 2
    source: {type: findings, check_in: [cloud.access_key_old, cloud.credential_unused, cloud.service_account_key_user_managed], require_collector: cloud}
  - id: cloud.least-privilege
    title: Workload identities hold no administrative roles; the password policy meets the benchmark
    csf: PR.AA
    cis: ["5.4", "6.8"]
    cis_benchmarks: {aws: ["1.8", "1.9", "1.16"], gcp: ["1.5"], azure: ["1.23"]}
    pillars: [people]
    check: automated
    weight: 1
    source: {type: findings, check_in: [cloud.admin_privileges_broad, cloud.password_policy_weak], require_collector: cloud}
  # ---- software / data ------------------------------------------------------------------------------------------------
  - id: cloud.storage-private
    title: No storage bucket/container, snapshot or image is publicly accessible
    csf: PR.DS
    cis: ["3.3"]
    cis_benchmarks: {aws: ["2.1.4"], gcp: ["5.1"], azure: ["3.7"]}
    pillars: [software]
    check: automated
    weight: 3
    source: {type: findings, check_in: [cloud.storage_public, cloud.snapshot_public], require_collector: cloud}
  - id: cloud.storage-encrypted
    title: Storage enforces encryption at rest and in transit
    csf: PR.DS
    cis: ["3.10", "3.11"]
    cis_benchmarks: {aws: ["2.1.1"], azure: ["3.1", "3.2"]}
    pillars: [software]
    check: automated
    weight: 1
    source: {type: findings, check_in: [cloud.storage_unencrypted, cloud.storage_insecure_transport], require_collector: cloud}
  - id: cloud.audit-logging
    title: Control-plane audit logging is on in every account and region
    csf: DE.CM
    cis: ["8.2", "8.5"]
    cis_benchmarks: {aws: ["3.1"], gcp: ["2.1"], azure: ["5.1.1"]}
    pillars: [software]
    check: automated
    weight: 3
    source: {type: findings, check_in: [cloud.audit_log_disabled], require_collector: cloud}
  - id: cloud.other-findings
    title: No high or critical cloud finding outside the controls above (engine checks without a generic control)
    csf: ID.RA
    cis: ["7.1"]
    pillars: [network, device, people, software]
    check: automated
    weight: 1
    source: {type: findings, check_prefix: ["cloud.aws.", "cloud.gcp.", "cloud.azure."], severity_in: [critical, high], require_collector: cloud}
