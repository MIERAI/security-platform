name: ci
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install 'PyYAML==6.0.3'
      - name: Schema (findings contract, fixtures)
        run: python -m unittest tests.test_contract -v
      - name: Unit and output-contract tests
        run: python -m unittest discover -s tests -v
      - name: Generated files are current
        run: python generators/gen.py && git diff --exit-code dist/
  residue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: No instance-specific values (patterns are a repository secret)
        env: { RESIDUE_PATTERNS: "${{ secrets.RESIDUE_PATTERNS }}" }
        run: |
          if [ -z "$RESIDUE_PATTERNS" ]; then
            echo "::warning::RESIDUE_PATTERNS is not available (fork pull request): residue check skipped; it runs again on main"
            exit 0
          fi
          umask 077; printf '%s\n' "$RESIDUE_PATTERNS" > "$RUNNER_TEMP/patterns"
          bin/check-residue "$RUNNER_TEMP/patterns"
          bin/check-residue --history "$RUNNER_TEMP/patterns" > /dev/null
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks (official release, checksum verified) over the full history
        env: { V: "8.30.1" }
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep " gitleaks_${V}_linux_x64.tar.gz\$" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          cd "$GITHUB_WORKSPACE" && "$RUNNER_TEMP/gitleaks" git --redact --no-banner -v .
