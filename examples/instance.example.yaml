# Example instance config (fictional values). Copy to a PRIVATE location and edit.
name: example-co
exposure:
  discovery:
    - type: static
      targets: [{name: web-1, address: 192.0.2.10}, {name: db-1, address: 192.0.2.20}]
    # - {type: tailscale}          # or an overlay network
    # - {type: aws-vpc, ...}       # future adapter
  vantage: {type: ssh, host: scanner.example.net}   # a host OUTSIDE the scanned network
  extra_ports: "8443"
hosts:
  - {name: web-1, exec: {type: ssh, host: web-1}, profile: linux}
  - {name: laptop-of-admin, exec: {type: local}, profile: macos}
kubernetes:
  - {name: prod, kubeconfig: ~/.kube/prod-readonly.yaml, role: prod}
codehost:
  - {type: github, owner: example-co, gh_user: security-bot}
secrets_files:
  - {host: web-1, exec: {type: ssh, host: web-1}, roots: ["~", "/etc"], sudo: true}
agents:
  - {type: claude-code, settings: ["~/.claude/settings.json"], memory_dirs: ["~/.claude/projects"],
     transcripts_dirs: ["~/.claude/projects"], min_transcript_retention_days: 30}
identity:                              # the people pillar (collectors/identity; adapters/identity.py)
  providers:
    - {type: github, accounts: [{gh_user: example-admin}], orgs: [example-co], repos_owner: example-co,
       expected_collaborators: [example-admin, example-dev]}
    - {type: tailscale, api_key_file: ~/.config/security-platform/tailscale-api.key}   # READ-ONLY key, mode 0600
    - {type: okta}                     # interface only: a coverage gap until implemented
  credentials: {kubeconfigs: ["~/.kube/*.yaml"], ssh_dirs: ["~/.ssh"], docker_configs: ["~/.docker/config.json"],
                token_files: ["~/.config/security-platform/*.token"]}
  max_token_age_days: 90
# cloud:                               # docs/cloud.md; without it the cloud scorecard dimension is not applicable
#   accounts:
#     - {provider: aws, account_id: "123456789012", role_arn: "arn:aws:iam::123456789012:role/security-platform-audit",
#        audience: sts.amazonaws.com, identity_token: {type: file, path: /var/run/secrets/tokens/aws}, regions: [eu-west-1]}
#   engines:
#     prowler: {path: ~/.local/opt/security-platform/tools/prowler/current/bin/prowler}
scorecard:                             # docs/scorecard.md: the weakest dimension decides
  threshold: 75
  vars: {hub_host: "host:sec-hub", self_repo: "repo:github/example-co/security-platform", self_image: "ghcr.io/example-co/security-platform"}
intel:
  feeds: [{type: cisa-kev}, {type: epss}, {type: osv, ecosystems: [Go, PyPI]}]
  update_db: true                    # refresh Trivy's DB before matching
  sbom_max_age_days: 30
  registry_auth: [{host: registry.example.com, username: security-bot, token_file: ~/.config/security-platform/registry.token}]
  repos: ["~/src/service-a"]
advisor: {type: none}
remediation:                         # every open finding: an owner and an SLO-tracked path to closure (design §13)
  tracker: {type: files}             # private, in the data dir. Or (a PRIVATE repo only; refused otherwise):
  # tracker: {type: github-issues, repo: example-org/security-tracker, enabled: true}
  default_owner: security-oncall
  owners:
    - {layer_in: [workload, supply-chain], owner: platform-team}
    - {asset_prefix: "repo:", owner: dev-team}
  slo: {kev_exposed: 1d, critical: 7d, high: 30d, medium: 90d, low: 180d}
  advisor: {type: none}              # may only DRAFT remediation text; never closes or merges
runner:                              # continuous operation (docs/runner.md)
  site: hub
  role: hub
  sinks:
    - {type: textfile, path: /var/lib/node_exporter/textfile/security-platform.prom}
    # - {type: kubernetes-configmap, kubeconfig: ~/.kube/prod.yaml, namespace: security-platform, name: security-platform-metrics}
    # - {type: remote_write, url: https://metrics.example.com/api/v1/write, bearer_token_file: ~/.config/security-platform/rw.token}
  jobs:
    host:            {schedule: "15 2 * * *", jitter: 30m, timeout: 30m, retries: 2, retry_delay: 30m}
    k8s:             {schedule: "45 2 * * *", jitter: 15m, timeout: 45m, retries: 2}
    intel:           {collector: vuln-intel, schedule: "30 6 * * *", timeout: 2h, retries: 2, retry_delay: 1h}
    codehost-github: {schedule: "0 7 * * *", jitter: 30m, timeout: 30m, retries: 2}
    secrets-files:   {schedule: "30 7 * * *", jitter: 30m, timeout: 30m}
    agent-claude-code: {schedule: "0 8 * * *", timeout: 5m}
    ingest-scanner:                  # the external vantage host runs exposure itself (role: site) ...
      type: ingest
      schedule: "*/30 * * * *"
      site: vantage
      source: {type: exec, exec: {type: ssh, host: scanner.example.net}, dir: "~/.local/share/security-platform/outbox"}
      site_state: "~/.local/share/security-platform/site-state"
      site_collectors: {exposure: "30 3 * * *"}
      publish_assets: {dir: "~/.local/share/security-platform/assets", discovery: [{type: static, targets: [{name: web-1, address: 192.0.2.10}]}]}
    remediation:     {type: remediation, schedule: "50 * * * *"}
    digest:          {type: digest, schedule: "0 9 * * 1"}
# ... and the vantage host's own config (JSON is fine; no PyYAML needed there):
# {"name": "example", "exposure": {"discovery": [{"type": "file", "path": "~/.local/share/security-platform/assets/assets.json", "max_age": 259200}],
#  "vantage": {"type": "local"}},
#  "runner": {"site": "vantage", "role": "site", "outbox": {"type": "local", "dir": "~/.local/share/security-platform/outbox"},
#             "state_outbox": {"type": "local", "dir": "~/.local/share/security-platform/site-state"},
#             "jobs": {"exposure": {"schedule": "30 3 * * *", "jitter": "20m", "max_delay": "3h", "timeout": "2h", "retries": 1}}}}
