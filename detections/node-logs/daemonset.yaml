# node-logs: one Grafana Alloy per node shipping the node's security logs (API audit log, auth journal) to Loki.
# Read-only host mounts; runs as root only because the audit log and the journal are root-owned (no capabilities:
# the owner check needs none). No Kubernetes API access. The instance overlay sets CLUSTER, LOKI_URL, LOKI_TOKEN and
# the audit log's host directory if it is not k3s's (volume `audit`).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-logs
  labels: { app: node-logs, app.kubernetes.io/part-of: security-platform }
spec:
  selector: { matchLabels: { app: node-logs } }
  updateStrategy: { type: RollingUpdate }
  template:
    metadata: { labels: { app: node-logs, app.kubernetes.io/part-of: security-platform } }
    spec:
      automountServiceAccountToken: false
      priorityClassName: system-node-critical      # a security sensor is the last thing to evict
      tolerations: [{ operator: Exists }]
      securityContext: { runAsUser: 0, runAsGroup: 0, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: alloy
          image: mirror.gcr.io/grafana/alloy:v1.22.0
          args: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy, --server.http.listen-addr=0.0.0.0:12345,
                 --stability.level=generally-available, --disable-reporting]
          env:
            - { name: CLUSTER, value: set-by-overlay }
            - { name: LOKI_URL, value: set-by-overlay }
            - { name: LOKI_TOKEN, value: "" }
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: GOMEMLIMIT, value: 80MiB }
          ports: [{ containerPort: 12345, name: http-metrics }]
          readinessProbe: { httpGet: { path: /-/ready, port: http-metrics }, periodSeconds: 15, timeoutSeconds: 3 }
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/alloy, readOnly: true }
            - { name: state, mountPath: /var/lib/alloy }
            - { name: audit, mountPath: /host/audit, readOnly: true }
            - { name: journal, mountPath: /host/journal, readOnly: true }
            - { name: machine-id, mountPath: /etc/machine-id, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: config, configMap: { name: node-logs } }
        # read positions survive restarts (no gap, no replay); one small directory per node
        - { name: state, hostPath: { path: /var/lib/security-platform/node-logs, type: DirectoryOrCreate } }
        - { name: audit, hostPath: { path: /var/lib/rancher/k3s/server/logs, type: DirectoryOrCreate } }
        - { name: journal, hostPath: { path: /var/log/journal, type: Directory } }
        - { name: machine-id, hostPath: { path: /etc/machine-id, type: File } }
        - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
---
# Alloy's own metrics: loki_write_* (sent / dropped entries), loki_source_* (lines read): the pipeline's health
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: { name: node-logs, labels: { app.kubernetes.io/part-of: security-platform } }
spec:
  selector: { matchLabels: { app: node-logs } }
  podMetricsEndpoints: [{ port: http-metrics, interval: 60s }]
