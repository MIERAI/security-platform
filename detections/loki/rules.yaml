# generated by security-platform detections 0.1.0 (render.py) from detections/catalog.yaml - do not edit
groups:
- name: security-detection.falco
  interval: 1m
  rules:
  - alert: SecurityDetectionFalcoShellInContainer
    expr: sum by (cluster, rule, ns, pod) (count_over_time({container="falco"} | json rule, ns="output_fields[\"k8s.ns.name\"]", pod="output_fields[\"k8s.pod.name\"]" | rule="Terminal shell in container"
      [5m])) > 0
    for: 0m
    labels:
      severity: ticket
      component: security-detection
      detection: falco-shell-in-container
      pillar: device
    annotations:
      summary: Interactive shell in {{ $labels.ns }}/{{ $labels.pod }} ({{ $labels.cluster }})
      title: Interactive shell in a container
      runbook_url: docs/runbooks/falco-shell-in-container.md
      attack: T1059, T1609
  - alert: SecurityDetectionFalcoUnexpectedOutbound
    expr: sum by (cluster, ns, pod) (count_over_time({container="falco"} | json rule, ns="output_fields[\"k8s.ns.name\"]", pod="output_fields[\"k8s.pod.name\"]" | rule="SP Unexpected outbound connection
      from container" [5m])) > 0
    for: 0m
    labels:
      severity: ticket
      component: security-detection
      detection: falco-unexpected-outbound
      pillar: network
    annotations:
      summary: Outbound connection outside the expected networks from {{ $labels.ns }}/{{ $labels.pod }} ({{ $labels.cluster }})
      title: Unexpected outbound connection from a container
      runbook_url: docs/runbooks/falco-unexpected-outbound.md
      attack: T1041, T1071
  - alert: SecurityDetectionFalcoSensitiveFileRead
    expr: sum by (cluster, rule, ns, pod) (count_over_time({container="falco"} | json rule, ns="output_fields[\"k8s.ns.name\"]", pod="output_fields[\"k8s.pod.name\"]" | rule=~"Read sensitive file untrusted|Search
      Private Keys or Passwords" [5m])) > 0
    for: 0m
    labels:
      severity: ticket
      component: security-detection
      detection: falco-sensitive-file-read
      pillar: device
    annotations:
      summary: Sensitive file read / credential search ({{ $labels.rule }}) in {{ $labels.ns }}/{{ $labels.pod }} ({{ $labels.cluster }})
      title: Sensitive file read or credential search
      runbook_url: docs/runbooks/falco-sensitive-file-read.md
      attack: T1003.008, T1552.001
  - alert: SecurityDetectionFalcoPrivilegeEscalation
    expr: sum by (cluster, rule, ns, pod) (count_over_time({container="falco"} | json rule, ns="output_fields[\"k8s.ns.name\"]", pod="output_fields[\"k8s.pod.name\"]" | rule=~"SP Privilege escalation tool
      in container|SP Setuid or setgid bit set|PTRACE attached to process|Linux Kernel Module Injection Detected|Detect release_agent File Container Escapes" [5m])) > 0
    for: 0m
    labels:
      severity: page
      component: security-detection
      detection: falco-privilege-escalation
      pillar: device
    annotations:
      summary: Privilege escalation / escape signal ({{ $labels.rule }}) in {{ $labels.ns }}/{{ $labels.pod }} ({{ $labels.cluster }})
      title: Privilege escalation or container escape attempt
      runbook_url: docs/runbooks/falco-privilege-escalation.md
      attack: T1548, T1611, T1055.008, T1547.006
  - alert: SecurityDetectionFalcoCryptoMiner
    expr: sum by (cluster, ns, pod) (count_over_time({container="falco"} | json rule, ns="output_fields[\"k8s.ns.name\"]", pod="output_fields[\"k8s.pod.name\"]" | rule="SP Crypto miner activity" [5m]))
      > 0
    for: 0m
    labels:
      severity: page
      component: security-detection
      detection: falco-crypto-miner
      pillar: device
    annotations:
      summary: Crypto mining indicator in {{ $labels.ns }}/{{ $labels.pod }} ({{ $labels.cluster }})
      title: Crypto miner activity
      runbook_url: docs/runbooks/falco-crypto-miner.md
      attack: T1496
  - alert: SecurityDetectionFalcoWriteBelowEtc
    expr: sum by (cluster, ns, pod) (count_over_time({container="falco"} | json rule, ns="output_fields[\"k8s.ns.name\"]", pod="output_fields[\"k8s.pod.name\"]" | rule="SP Write below etc in container"
      [5m])) > 0
    for: 0m
    labels:
      severity: ticket
      component: security-detection
      detection: falco-write-below-etc
      pillar: device
    annotations:
      summary: Run-time write below /etc in {{ $labels.ns }}/{{ $labels.pod }} ({{ $labels.cluster }})
      title: Write below /etc in a running container
      runbook_url: docs/runbooks/falco-write-below-etc.md
      attack: T1543, T1222
  - alert: SecurityDetectionFalcoDropAndExecute
    expr: sum by (cluster, rule, ns, pod) (count_over_time({container="falco"} | json rule, ns="output_fields[\"k8s.ns.name\"]", pod="output_fields[\"k8s.pod.name\"]" | rule=~"Drop and execute new binary
      in container|Fileless execution via memfd_create|Execution from /dev/shm" [5m])) > 0
    for: 0m
    labels:
      severity: page
      component: security-detection
      detection: falco-drop-and-execute
      pillar: device
    annotations:
      summary: '{{ $labels.rule }} in {{ $labels.ns }}/{{ $labels.pod }} ({{ $labels.cluster }})'
      title: New or fileless binary executed in a container
      runbook_url: docs/runbooks/falco-drop-and-execute.md
      attack: T1105, T1620
  - alert: SecurityDetectionFalcoReverseShell
    expr: sum by (cluster, rule, ns, pod) (count_over_time({container="falco"} | json rule, ns="output_fields[\"k8s.ns.name\"]", pod="output_fields[\"k8s.pod.name\"]" | rule=~"Redirect STDOUT/STDIN to Network
      Connection in Container|Netcat Remote Code Execution in Container" [5m])) > 0
    for: 0m
    labels:
      severity: page
      component: security-detection
      detection: falco-reverse-shell
      pillar: network
    annotations:
      summary: Reverse shell pattern ({{ $labels.rule }}) in {{ $labels.ns }}/{{ $labels.pod }} ({{ $labels.cluster }})
      title: Reverse shell pattern
      runbook_url: docs/runbooks/falco-reverse-shell.md
      attack: T1059.004, T1095
  - alert: SecurityDetectionFalcoLogTampering
    expr: sum by (cluster, ns, pod) (count_over_time({container="falco"} | json rule, ns="output_fields[\"k8s.ns.name\"]", pod="output_fields[\"k8s.pod.name\"]" | rule="Clear Log Activities" [5m])) > 0
    for: 0m
    labels:
      severity: ticket
      component: security-detection
      detection: falco-log-tampering
      pillar: device
    annotations:
      summary: Log files truncated/removed in {{ $labels.ns }}/{{ $labels.pod }} ({{ $labels.cluster }})
      title: Log files cleared
      runbook_url: docs/runbooks/falco-log-tampering.md
      attack: T1070.002
  - alert: SecurityDetectionFalcoAuthorizedKeysModified
    expr: sum by (cluster, hostname) (count_over_time({container="falco"} | json rule, hostname | rule="SP Authorized keys modified" [5m])) > 0
    for: 0m
    labels:
      severity: page
      component: security-detection
      detection: falco-authorized-keys-modified
      pillar: device
    annotations:
      summary: authorized_keys / sshd configuration opened for writing on {{ $labels.hostname }} ({{ $labels.cluster }})
      title: SSH authorized keys or sshd configuration written (cluster node or container)
      runbook_url: docs/runbooks/falco-authorized-keys-modified.md
      attack: T1098.004
- name: security-detection.k8s-audit
  interval: 1m
  rules:
  - alert: SecurityDetectionK8sPodExec
    expr: sum by (cluster, user, ns, name, sub) (count_over_time({source="k8s-audit"} |~ "exec|attach|portforward" | json verb, user="user.username", resource="objectRef.resource", sub="objectRef.subresource",
      ns="objectRef.namespace", name="objectRef.name", code="responseStatus.code", uri="requestURI" | resource="pods" | sub=~"exec|attach|portforward" | code=~"1..|2.." [5m])) > 0
    for: 0m
    labels:
      severity: ticket
      component: security-detection
      detection: k8s-pod-exec
      pillar: network
    annotations:
      summary: '{{ $labels.user }} ran {{ $labels.sub }} into {{ $labels.ns }}/{{ $labels.name }} ({{ $labels.cluster }})'
      title: Exec, attach or port-forward into a pod
      runbook_url: docs/runbooks/k8s-pod-exec.md
      attack: T1609
  - alert: SecurityDetectionK8sSecretReadUnexpected
    expr: sum by (cluster, user, ns) (count_over_time({source="k8s-audit"} |= "secrets" | json verb, user="user.username", resource="objectRef.resource", sub="objectRef.subresource", ns="objectRef.namespace",
      name="objectRef.name", code="responseStatus.code", uri="requestURI" | resource="secrets" | verb=~"get|list|watch" | code=~"2.." | user!~"system:(apiserver|kube-controller-manager|kube-scheduler|k3s-.*|node:.*|serviceaccount:(kube-system|argocd|cert-manager|cnpg-system|kyverno|monitoring|chaos-mesh|argo-rollouts):.*)"
      [5m])) > 0
    for: 0m
    labels:
      severity: ticket
      component: security-detection
      detection: k8s-secret-read-unexpected
      pillar: network
    annotations:
      summary: '{{ $labels.user }} read Secrets in {{ $labels.ns }} ({{ $labels.cluster }})'
      title: Secret read by an unexpected subject
      runbook_url: docs/runbooks/k8s-secret-read-unexpected.md
      attack: T1552.007
  - alert: SecurityDetectionK8sRbacChanged
    expr: sum by (cluster, user, resource, ns, name) (count_over_time({source="k8s-audit"} |= "rbac.authorization.k8s.io" | json verb, user="user.username", resource="objectRef.resource", sub="objectRef.subresource",
      ns="objectRef.namespace", name="objectRef.name", code="responseStatus.code", uri="requestURI" | resource=~"roles|rolebindings|clusterroles|clusterrolebindings" | verb=~"create|update|patch|delete|deletecollection"
      | code=~"2.." | user!~"system:(apiserver|kube-controller-manager|k3s-.*|serviceaccount:(kube-system|argocd|kyverno|cert-manager):.*)" [5m])) > 0
    for: 0m
    labels:
      severity: ticket
      component: security-detection
      detection: k8s-rbac-changed
      pillar: network
    annotations:
      summary: '{{ $labels.user }} changed {{ $labels.resource }} {{ $labels.ns }}/{{ $labels.name }} ({{ $labels.cluster }})'
      title: RBAC changed outside GitOps
      runbook_url: docs/runbooks/k8s-rbac-changed.md
      attack: T1098, T1078.004
  - alert: SecurityDetectionK8sClusterrolebindingCreated
    expr: sum by (cluster, user, name) (count_over_time({source="k8s-audit"} |= "clusterrolebindings" | json verb, user="user.username", resource="objectRef.resource", sub="objectRef.subresource", ns="objectRef.namespace",
      name="objectRef.name", code="responseStatus.code", uri="requestURI" | resource="clusterrolebindings" | verb="create" | code=~"2.." | user!~"system:(apiserver|kube-controller-manager|kube-scheduler|k3s-.*|serviceaccount:kube-system:.*|node:.*)"
      [5m])) > 0
    for: 0m
    labels:
      severity: ticket
      component: security-detection
      detection: k8s-clusterrolebinding-created
      pillar: network
    annotations:
      summary: 'ClusterRoleBinding {{ $labels.name }} created by {{ $labels.user }} ({{ $labels.cluster }}): confirm it came from a reviewed change'
      title: New ClusterRoleBinding
      runbook_url: docs/runbooks/k8s-clusterrolebinding-created.md
      attack: T1098
  - alert: SecurityDetectionK8sAnonymousAccess
    expr: sum by (cluster, uri) (count_over_time({source="k8s-audit"} |= "system:anonymous" | json verb, user="user.username", resource="objectRef.resource", sub="objectRef.subresource", ns="objectRef.namespace",
      name="objectRef.name", code="responseStatus.code", uri="requestURI" | user="system:anonymous" | code=~"2.." | uri!~"/(healthz|livez|readyz|version|\\.well-known/openid-configuration|openid/v1/jwks).*"
      [5m])) > 0
    for: 0m
    labels:
      severity: ticket
      component: security-detection
      detection: k8s-anonymous-access
      pillar: network
    annotations:
      summary: Anonymous request to {{ $labels.uri }} was allowed ({{ $labels.cluster }})
      title: Anonymous request allowed beyond public discovery
      runbook_url: docs/runbooks/k8s-anonymous-access.md
      attack: T1190, T1078.001
  - alert: SecurityDetectionK8sAuthFailuresBurst
    expr: sum by (cluster, user) (count_over_time({source="k8s-audit"} |~ "\"code\":40[13]" | json verb, user="user.username", resource="objectRef.resource", sub="objectRef.subresource", ns="objectRef.namespace",
      name="objectRef.name", code="responseStatus.code", uri="requestURI" | code=~"401|403" [5m])) >= 30
    for: 0m
    labels:
      severity: ticket
      component: security-detection
      detection: k8s-auth-failures-burst
      pillar: network
    annotations:
      summary: '{{ $value }} rejected API requests from {{ $labels.user }} in 5 minutes ({{ $labels.cluster }})'
      title: Burst of rejected API requests
      runbook_url: docs/runbooks/k8s-auth-failures-burst.md
      attack: T1110, T1580
  - alert: SecurityDetectionK8sTokenMinted
    expr: sum by (cluster, user, ns, name) (count_over_time({source="k8s-audit"} |= "serviceaccounts" | json verb, user="user.username", resource="objectRef.resource", sub="objectRef.subresource", ns="objectRef.namespace",
      name="objectRef.name", code="responseStatus.code", uri="requestURI" | resource="serviceaccounts" | sub="token" | verb="create" | code=~"2.." | user!~"system:(apiserver|kube-controller-manager|node:.*|serviceaccount:kube-system:.*)"
      [5m])) > 0
    for: 0m
    labels:
      severity: ticket
      component: security-detection
      detection: k8s-token-minted
      pillar: network
    annotations:
      summary: '{{ $labels.user }} minted a token for {{ $labels.ns }}/{{ $labels.name }} ({{ $labels.cluster }})'
      title: ServiceAccount token minted by a person or unexpected subject
      runbook_url: docs/runbooks/k8s-token-minted.md
      attack: T1528
- name: security-detection.auth
  interval: 1m
  rules:
  - alert: SecurityDetectionAuthSshFailedBurst
    expr: sum by (host) (count_over_time({source="auth"} | event="ssh_login_failure" [10m])) >= 10
    for: 0m
    labels:
      severity: ticket
      component: security-detection
      detection: auth-ssh-failed-burst
      pillar: device
    annotations:
      summary: '{{ $value }} failed SSH logins on {{ $labels.host }} in 10 minutes'
      title: Burst of failed SSH logins
      runbook_url: docs/runbooks/auth-ssh-failed-burst.md
      attack: T1110
  - alert: SecurityDetectionAuthSshLoginUntrustedNetwork
    expr: sum by (host, user, src_ip) (count_over_time({source="auth"} | event="ssh_login_success" | src_ip != ip("10.0.0.0/8") | src_ip != ip("172.16.0.0/12") | src_ip != ip("192.168.0.0/16") | src_ip
      != ip("100.64.0.0/10") | src_ip != ip("127.0.0.0/8") | src_ip != ip("::1") [5m])) > 0
    for: 0m
    labels:
      severity: page
      component: security-detection
      detection: auth-ssh-login-untrusted-network
      pillar: network
    annotations:
      summary: '{{ $labels.user }} logged in to {{ $labels.host }} from {{ $labels.src_ip }} (outside the trusted networks)'
      title: Successful SSH login from outside the trusted networks
      runbook_url: docs/runbooks/auth-ssh-login-untrusted-network.md
      attack: T1078, T1133
  - alert: SecurityDetectionAuthSshLoginNewSource
    expr: sum by (host, user, src_ip) (count_over_time({source="auth"} | event="ssh_login_success" | novel="true" [30m])) > 0
    for: 0m
    labels:
      severity: ticket
      component: security-detection
      detection: auth-ssh-login-new-source
      pillar: device
    annotations:
      summary: First login of {{ $labels.user }} to {{ $labels.host }} from {{ $labels.src_ip }}
      title: Successful SSH login from a source never seen before
      runbook_url: docs/runbooks/auth-ssh-login-new-source.md
      attack: T1078
  - alert: SecurityDetectionAuthSudoUnexpectedUser
    expr: sum by (host, user) (count_over_time({source="auth"} | event="sudo" | user!~".+" [5m])) > 0
    for: 0m
    labels:
      severity: ticket
      component: security-detection
      detection: auth-sudo-unexpected-user
      pillar: device
    annotations:
      summary: '{{ $labels.user }} used sudo on {{ $labels.host }}'
      title: sudo by an unexpected user
      runbook_url: docs/runbooks/auth-sudo-unexpected-user.md
      attack: T1548.003
  - alert: SecurityDetectionAuthSudoFailure
    expr: sum by (host, user) (count_over_time({source="auth"} | event="sudo_failure" [10m])) > 0
    for: 0m
    labels:
      severity: ticket
      component: security-detection
      detection: auth-sudo-failure
      pillar: device
    annotations:
      summary: sudo refused / wrong password for {{ $labels.user }} on {{ $labels.host }}
      title: Failed or refused sudo
      runbook_url: docs/runbooks/auth-sudo-failure.md
      attack: T1548.003, T1110
  - alert: SecurityDetectionAuthAuthorizedKeysChanged
    expr: sum by (host, user) (count_over_time({source="auth"} | event="authorized_keys_changed" [30m])) > 0
    for: 0m
    labels:
      severity: page
      component: security-detection
      detection: auth-authorized-keys-changed
      pillar: device
    annotations:
      summary: authorized_keys of {{ $labels.user }} on {{ $labels.host }} changed
      title: SSH authorized keys changed on a host
      runbook_url: docs/runbooks/auth-authorized-keys-changed.md
      attack: T1098.004
- name: security-detection.codehost
  interval: 1m
  rules:
  - alert: SecurityDetectionCodehostCredentialAdded
    expr: sum by (host, event) (count_over_time({source="codehost"} | event=~"ssh_key_added|gpg_key_added|signing_key_added" [30m])) > 0
    for: 0m
    labels:
      severity: page
      component: security-detection
      detection: codehost-credential-added
      pillar: network
    annotations:
      summary: '{{ $labels.event }} on code host account {{ $labels.host }}'
      title: New SSH, GPG or signing key on the code host account
      runbook_url: docs/runbooks/codehost-credential-added.md
      attack: T1098.004, T1098.001
  - alert: SecurityDetectionCodehostRepoMadePublic
    expr: sum by (host, repo) (count_over_time({source="codehost"} | event="repo_made_public" [30m])) > 0
    for: 0m
    labels:
      severity: page
      component: security-detection
      detection: codehost-repo-made-public
      pillar: network
    annotations:
      summary: Repository {{ $labels.repo }} became public ({{ $labels.host }})
      title: Repository made public
      runbook_url: docs/runbooks/codehost-repo-made-public.md
      attack: T1567, T1213.003
  - alert: SecurityDetectionCodehostIntegrationAdded
    expr: sum by (host, event, repo) (count_over_time({source="codehost"} | event=~"deploy_key_added|hook_added|app_installation_added|oauth_authorization_added" [30m])) > 0
    for: 0m
    labels:
      severity: ticket
      component: security-detection
      detection: codehost-integration-added
      pillar: network
    annotations:
      summary: '{{ $labels.event }} on {{ $labels.repo }} ({{ $labels.host }})'
      title: Deploy key, webhook or application access added
      runbook_url: docs/runbooks/codehost-integration-added.md
      attack: T1098, T1199
- name: security-detection.overlay-network
  interval: 1m
  rules:
  - alert: SecurityDetectionOverlayNetworkChange
    expr: sum by (event, actor) (count_over_time({source="overlay-network"} | event=~"node_added|node_key_expiry_disabled|policy_changed|auth_key_created|user_added|user_role_changed|exit_node_enabled|subnet_routes_changed"
      [30m])) > 0
    for: 0m
    labels:
      severity: ticket
      component: security-detection
      detection: overlay-network-change
      pillar: network
    annotations:
      summary: '{{ $labels.event }} by {{ $labels.actor }} on the overlay network'
      title: Overlay network control-plane change
      runbook_url: docs/runbooks/overlay-network-change.md
      attack: T1098, T1133
