# Detection catalog (component `detections`, see VERSION). The single source of truth for "what do we detect":
# every rule has an id, a source, a severity, ATT&CK technique(s), a pillar, a query and a runbook
# (docs/runbooks/<id>.md, enforced by tests). render.py turns it into:
#   loki/rules.yaml              Loki ruler rule groups (log-sourced rules; the log store evaluates them)
#   falco/prometheus-rules.yaml  PrometheusRule (in-cluster backstop on Falco's metrics + pipeline health)
# Queries use $params (string.Template); an instance overrides params with `render.py --params <file>`.
#
# Sources and their log contract (docs/detection.md "Log contract"):
#   falco          Falco JSON events (stdout of the Falco pods, shipped by the cluster's pod-log pipeline)
#   k8s-audit      API server audit log (node-logs)                         labels: source, cluster, host
#   auth           sshd / sudo / key changes, any host                      labels: source, host[, cluster, ident]
#                  structured metadata: event, user, src_ip[, novel]
#   codehost       code host account / repository audit events             labels: source, host; s.m.: event, actor
#   overlay-network  overlay network (VPN) control-plane audit events       labels: source; s.m.: event, actor
# Severity: page (a human now) | ticket (same day) | info (recorded, no notification). Routing is the instance's
# Alertmanager configuration; labels: severity, component=security-detection, detection=<id>.
version: 0.2.1
released: "2026-11-24"          # rule-content date: security_detection_ruleset_age_days counts from here
upstream:
  falco_rules: "falco-rules 5.2.0"     # the upstream rules file the curated selection was reviewed against
  attack: "MITRE ATT&CK Enterprise v17"

params:
  runbook_base: docs/runbooks     # instances point it at their copy of the docs (a URL)
  falco: '{container="falco"} |= "output_fields"'    # event lines only (start-up messages are not JSON)
  audit: '{source="k8s-audit"}'
  auth: '{source="auth"}'
  codehost: '{source="codehost"}'
  overlay: '{source="overlay-network"}'
  # audit JSON fields used by the k8s-audit rules
  audit_fields: '| json verb, user="user.username", resource="objectRef.resource", sub="objectRef.subresource", ns="objectRef.namespace", name="objectRef.name", code="responseStatus.code", uri="requestURI" | __error__=""'
  # subjects allowed to do things without an alert (regular expressions, RE2, anchored by LogQL)
  gitops_subjects: 'system:serviceaccount:argocd:.*'
  control_plane_subjects: 'k3s-.*|system:(apiserver|kube-controller-manager|kube-scheduler|k3s-.*|serviceaccount:kube-system:.*|node:.*)'
  secret_readers: 'k3s-.*|system:(apiserver|kube-controller-manager|kube-scheduler|k3s-.*|node:.*|serviceaccount:(kube-system|argocd|cert-manager|cnpg-system|kyverno|monitoring|chaos-mesh|argo-rollouts):.*)'
  rbac_writers: 'k3s-.*|system:(apiserver|kube-controller-manager|k3s-.*|serviceaccount:(kube-system|argocd|kyverno|cert-manager):.*)'
  token_minters: 'system:(apiserver|kube-controller-manager|node:.*|serviceaccount:kube-system:.*)'
  sudo_users: '.+'                 # instances narrow it (e.g. the admin accounts); '.+' = nobody is unexpected
  ssh_failure_burst: "10"          # failed logins per host per 10 minutes
  auth_failure_burst: "30"         # API 401/403 per subject per 5 minutes
  # successful logins from outside these networks page (LogQL ip() filters: one per network)
  trusted_networks: '| src_ip != ip("10.0.0.0/8") | src_ip != ip("172.16.0.0/12") | src_ip != ip("192.168.0.0/16") | src_ip != ip("100.64.0.0/10") | src_ip != ip("127.0.0.0/8") | src_ip != ip("::1")'
  audit_clusters: []               # clusters whose audit log must never go quiet (one absence rule each)

rules:
  # ---------------------------------------------------------------------------- runtime (Falco, device pillar)
  - id: falco-shell-in-container
    title: Interactive shell in a container
    source: falco
    pillar: device
    severity: ticket
    attack: [T1059, T1609]
    query: 'sum by (cluster, rule, ns, k8s_pod) (count_over_time($falco | json rule, ns="output_fields[\"k8s.ns.name\"]", k8s_pod="output_fields[\"k8s.pod.name\"]" | __error__="" | rule="Terminal shell in container" [5m])) > 0'
    summary: 'Interactive shell in {{ $labels.ns }}/{{ $labels.k8s_pod }} ({{ $labels.cluster }})'
    drill: true
  - id: falco-unexpected-outbound
    title: Unexpected outbound connection from a container
    source: falco
    pillar: network
    severity: ticket
    attack: [T1041, T1071]
    query: 'sum by (cluster, ns, k8s_pod) (count_over_time($falco | json rule, ns="output_fields[\"k8s.ns.name\"]", k8s_pod="output_fields[\"k8s.pod.name\"]" | __error__="" | rule="SP Unexpected outbound connection from container" [5m])) > 0'
    summary: 'Outbound connection outside the expected networks from {{ $labels.ns }}/{{ $labels.k8s_pod }} ({{ $labels.cluster }})'
  - id: falco-sensitive-file-read
    title: Sensitive file read or credential search
    source: falco
    pillar: device
    severity: ticket
    attack: [T1003.008, T1552.001]
    query: 'sum by (cluster, rule, ns, k8s_pod) (count_over_time($falco | json rule, ns="output_fields[\"k8s.ns.name\"]", k8s_pod="output_fields[\"k8s.pod.name\"]" | __error__="" | rule=~"Read sensitive file untrusted|Search Private Keys or Passwords" [5m])) > 0'
    summary: 'Sensitive file read / credential search ({{ $labels.rule }}) in {{ $labels.ns }}/{{ $labels.k8s_pod }} ({{ $labels.cluster }})'
  - id: falco-privilege-escalation
    title: Privilege escalation or container escape attempt
    source: falco
    pillar: device
    severity: page
    attack: [T1548, T1611, T1055.008, T1547.006]
    query: 'sum by (cluster, rule, ns, k8s_pod) (count_over_time($falco | json rule, ns="output_fields[\"k8s.ns.name\"]", k8s_pod="output_fields[\"k8s.pod.name\"]" | __error__="" | rule=~"SP Privilege escalation tool in container|SP Setuid or setgid bit set|PTRACE attached to process|Linux Kernel Module Injection Detected|Detect release_agent File Container Escapes" [5m])) > 0'
    summary: 'Privilege escalation / escape signal ({{ $labels.rule }}) in {{ $labels.ns }}/{{ $labels.k8s_pod }} ({{ $labels.cluster }})'
  - id: falco-crypto-miner
    title: Crypto miner activity
    source: falco
    pillar: device
    severity: page
    attack: [T1496]
    query: 'sum by (cluster, ns, k8s_pod) (count_over_time($falco | json rule, ns="output_fields[\"k8s.ns.name\"]", k8s_pod="output_fields[\"k8s.pod.name\"]" | __error__="" | rule="SP Crypto miner activity" [5m])) > 0'
    summary: 'Crypto mining indicator in {{ $labels.ns }}/{{ $labels.k8s_pod }} ({{ $labels.cluster }})'
  - id: falco-write-below-etc
    title: Write below /etc in a running container
    source: falco
    pillar: device
    severity: ticket
    attack: [T1543, T1222]
    query: 'sum by (cluster, ns, k8s_pod) (count_over_time($falco | json rule, ns="output_fields[\"k8s.ns.name\"]", k8s_pod="output_fields[\"k8s.pod.name\"]" | __error__="" | rule="SP Write below etc in container" [5m])) > 0'
    summary: 'Run-time write below /etc in {{ $labels.ns }}/{{ $labels.k8s_pod }} ({{ $labels.cluster }})'
  - id: falco-drop-and-execute
    title: New or fileless binary executed in a container
    source: falco
    pillar: device
    severity: page
    attack: [T1105, T1620]
    query: 'sum by (cluster, rule, ns, k8s_pod) (count_over_time($falco | json rule, ns="output_fields[\"k8s.ns.name\"]", k8s_pod="output_fields[\"k8s.pod.name\"]" | __error__="" | rule=~"Drop and execute new binary in container|Fileless execution via memfd_create|Execution from /dev/shm" [5m])) > 0'
    summary: '{{ $labels.rule }} in {{ $labels.ns }}/{{ $labels.k8s_pod }} ({{ $labels.cluster }})'
  - id: falco-reverse-shell
    title: Reverse shell pattern
    source: falco
    pillar: network
    severity: page
    attack: [T1059.004, T1095]
    query: 'sum by (cluster, rule, ns, k8s_pod) (count_over_time($falco | json rule, ns="output_fields[\"k8s.ns.name\"]", k8s_pod="output_fields[\"k8s.pod.name\"]" | __error__="" | rule=~"Redirect STDOUT/STDIN to Network Connection in Container|Netcat Remote Code Execution in Container" [5m])) > 0'
    summary: 'Reverse shell pattern ({{ $labels.rule }}) in {{ $labels.ns }}/{{ $labels.k8s_pod }} ({{ $labels.cluster }})'
  - id: falco-log-tampering
    title: Log files cleared
    source: falco
    pillar: device
    severity: ticket
    attack: [T1070.002]
    query: 'sum by (cluster, ns, k8s_pod) (count_over_time($falco | json rule, ns="output_fields[\"k8s.ns.name\"]", k8s_pod="output_fields[\"k8s.pod.name\"]" | __error__="" | rule="Clear Log Activities" [5m])) > 0'
    summary: 'Log files truncated/removed in {{ $labels.ns }}/{{ $labels.k8s_pod }} ({{ $labels.cluster }})'
  - id: falco-authorized-keys-modified
    title: SSH authorized keys or sshd configuration written (cluster node or container)
    source: falco
    pillar: device
    severity: page
    attack: [T1098.004]
    query: 'sum by (cluster, hostname) (count_over_time($falco | json rule, hostname | __error__="" | rule="SP Authorized keys modified" [5m])) > 0'
    summary: 'authorized_keys / sshd configuration opened for writing on {{ $labels.hostname }} ({{ $labels.cluster }})'

  # ------------------------------------------------------------------ Kubernetes API audit (network + workload)
  - id: k8s-pod-exec
    title: Exec, attach or port-forward into a pod
    source: k8s-audit
    pillar: network
    severity: ticket
    attack: [T1609]
    query: 'sum by (cluster, user, ns, name, sub) (count_over_time($audit |~ "exec|attach|portforward" $audit_fields | resource="pods" | sub=~"exec|attach|portforward" | code=~"1..|2.." [5m])) > 0'
    summary: '{{ $labels.user }} ran {{ $labels.sub }} into {{ $labels.ns }}/{{ $labels.name }} ({{ $labels.cluster }})'
    drill: true
  - id: k8s-secret-read-unexpected
    title: Secret read by an unexpected subject
    source: k8s-audit
    pillar: network
    severity: ticket
    attack: [T1552.007]
    # workloads reading Secrets of their OWN namespace are normal (operators, instance managers); cross-namespace or
    # cluster-wide reads by a ServiceAccount, and any read by a person, are not (unless allowlisted)
    query: 'sum by (cluster, user, ns) (count_over_time($audit |= "secrets" $audit_fields | resource="secrets" | verb=~"get|list|watch" | code=~"2.." | user!~"$secret_readers" | label_format sa_ns=`{{ regexReplaceAll "^system:serviceaccount:([^:]+):.*$$" .user "$${1}" }}` | label_format own=`{{ if eq .sa_ns .ns }}yes{{ end }}` | own!="yes" [5m])) > 0'
    summary: '{{ $labels.user }} read Secrets in {{ $labels.ns }} ({{ $labels.cluster }})'
  - id: k8s-rbac-changed
    title: RBAC changed outside GitOps
    source: k8s-audit
    pillar: network
    severity: ticket
    attack: [T1098, T1078.004]
    query: 'sum by (cluster, user, resource, ns, name) (count_over_time($audit |= "rbac.authorization.k8s.io" $audit_fields | resource=~"roles|rolebindings|clusterroles|clusterrolebindings" | verb=~"create|update|patch|delete|deletecollection" | code=~"2.." | user!~"$rbac_writers" [5m])) > 0'
    summary: '{{ $labels.user }} changed {{ $labels.resource }} {{ $labels.ns }}/{{ $labels.name }} ({{ $labels.cluster }})'
  - id: k8s-clusterrolebinding-created
    title: New ClusterRoleBinding
    source: k8s-audit
    pillar: network
    severity: ticket
    attack: [T1098]
    query: 'sum by (cluster, user, name) (count_over_time($audit |= "clusterrolebindings" $audit_fields | resource="clusterrolebindings" | verb="create" | code=~"2.." | user!~"$control_plane_subjects" [5m])) > 0'
    summary: 'ClusterRoleBinding {{ $labels.name }} created by {{ $labels.user }} ({{ $labels.cluster }}): confirm it came from a reviewed change'
  - id: k8s-anonymous-access
    title: Anonymous request allowed beyond public discovery
    source: k8s-audit
    pillar: network
    severity: ticket
    attack: [T1190, T1078.001]
    query: 'sum by (cluster, uri) (count_over_time($audit |= "system:anonymous" $audit_fields | user="system:anonymous" | code=~"2.." | uri!~"/(healthz|livez|readyz|version|\\.well-known/openid-configuration|openid/v1/jwks).*" [5m])) > 0'
    summary: 'Anonymous request to {{ $labels.uri }} was allowed ({{ $labels.cluster }})'
  - id: k8s-auth-failures-burst
    title: Burst of rejected API requests
    source: k8s-audit
    pillar: network
    severity: ticket
    attack: [T1110, T1580]
    query: 'sum by (cluster, user) (count_over_time($audit |~ "\"code\":40[13]" $audit_fields | code=~"401|403" [5m])) >= $auth_failure_burst'
    summary: '{{ $value }} rejected API requests from {{ $labels.user }} in 5 minutes ({{ $labels.cluster }})'
  - id: k8s-token-minted
    title: ServiceAccount token minted by a person or unexpected subject
    source: k8s-audit
    pillar: network
    severity: ticket
    attack: [T1528]
    query: 'sum by (cluster, user, ns, name) (count_over_time($audit |= "serviceaccounts" $audit_fields | resource="serviceaccounts" | sub="token" | verb="create" | code=~"2.." | user!~"$token_minters" [5m])) > 0'
    summary: '{{ $labels.user }} minted a token for {{ $labels.ns }}/{{ $labels.name }} ({{ $labels.cluster }})'

  # ------------------------------------------------------------------------- host authentication (device pillar)
  - id: auth-ssh-failed-burst
    title: Burst of failed SSH logins
    source: auth
    pillar: device
    severity: ticket
    attack: [T1110]
    query: 'sum by (host) (count_over_time($auth | event="ssh_login_failure" [10m])) >= $ssh_failure_burst'
    summary: '{{ $value }} failed SSH logins on {{ $labels.host }} in 10 minutes'
  - id: auth-ssh-login-untrusted-network
    title: Successful SSH login from outside the trusted networks
    source: auth
    pillar: network
    severity: page
    attack: [T1078, T1133]
    query: 'sum by (host, user, src_ip) (count_over_time($auth | event="ssh_login_success" $trusted_networks [5m])) > 0'
    summary: '{{ $labels.user }} logged in to {{ $labels.host }} from {{ $labels.src_ip }} (outside the trusted networks)'
  - id: auth-ssh-login-new-source
    title: Successful SSH login from a source never seen before
    source: auth
    pillar: device
    severity: ticket
    attack: [T1078]
    query: 'sum by (host, user, src_ip) (count_over_time($auth | event="ssh_login_success" | novel="true" [30m])) > 0'
    summary: 'First login of {{ $labels.user }} to {{ $labels.host }} from {{ $labels.src_ip }}'
  - id: auth-sudo-unexpected-user
    title: sudo by an unexpected user
    source: auth
    pillar: device
    severity: ticket
    attack: [T1548.003]
    query: 'sum by (host, user) (count_over_time($auth | event="sudo" | user!~"$sudo_users" [5m])) > 0'
    summary: '{{ $labels.user }} used sudo on {{ $labels.host }}'
  - id: auth-sudo-failure
    title: Failed or refused sudo
    source: auth
    pillar: device
    severity: ticket
    attack: [T1548.003, T1110]
    query: 'sum by (host, user) (count_over_time($auth | event="sudo_failure" [10m])) > 0'
    summary: 'sudo refused / wrong password for {{ $labels.user }} on {{ $labels.host }}'
  - id: auth-authorized-keys-changed
    title: SSH authorized keys changed on a host
    source: auth
    pillar: device
    severity: page
    attack: [T1098.004]
    query: 'sum by (host, user) (count_over_time($auth | event="authorized_keys_changed" [30m])) > 0'
    summary: 'authorized_keys of {{ $labels.user }} on {{ $labels.host }} changed'

  # -------------------------------------------------------------------------------- SaaS control planes (network)
  - id: codehost-credential-added
    title: New SSH, GPG or signing key on the code host account
    source: codehost
    pillar: network
    severity: page
    attack: [T1098.004, T1098.001]
    query: 'sum by (host, event) (count_over_time($codehost | event=~"ssh_key_added|gpg_key_added|signing_key_added" [30m])) > 0'
    summary: '{{ $labels.event }} on code host account {{ $labels.host }}'
  - id: codehost-repo-made-public
    title: Repository made public
    source: codehost
    pillar: network
    severity: page
    attack: [T1567, T1213.003]
    query: 'sum by (host, repo) (count_over_time($codehost | event="repo_made_public" [30m])) > 0'
    summary: 'Repository {{ $labels.repo }} became public ({{ $labels.host }})'
  - id: codehost-integration-added
    title: Deploy key, webhook or application access added
    source: codehost
    pillar: network
    severity: ticket
    attack: [T1098, T1199]
    query: 'sum by (host, event, repo) (count_over_time($codehost | event=~"deploy_key_added|hook_added|app_installation_added|oauth_authorization_added" [30m])) > 0'
    summary: '{{ $labels.event }} on {{ $labels.repo }} ({{ $labels.host }})'
  - id: overlay-network-change
    title: Overlay network control-plane change
    source: overlay-network
    pillar: network
    severity: ticket
    attack: [T1098, T1133]
    query: 'sum by (event, actor) (count_over_time($overlay | event=~"node_added|node_key_expiry_disabled|policy_changed|auth_key_created|user_added|user_role_changed|exit_node_enabled|subnet_routes_changed" [30m])) > 0'
    summary: '{{ $labels.event }} by {{ $labels.actor }} on the overlay network'

# In-cluster rules (Prometheus, no dependency on the log store): pipeline health below, and every falco-source rule
# above again on Falco's per-rule counters (render.py adds them, label engine=falco-metrics). Rendered into
# falco/prometheus-rules.yaml with the same labels; each has a runbook too.
prometheus:
  - id: falco-sensor-down
    title: Runtime sensor not running on every node
    pillar: device
    severity: ticket
    attack: [T1562.001]
    for: 15m
    expr: 'max by (namespace, daemonset) (kube_daemonset_status_desired_number_scheduled{daemonset="falco"} - kube_daemonset_status_number_ready{daemonset="falco"}) > 0 or absent(kube_daemonset_status_number_ready{daemonset="falco"})'
    summary: 'Falco is not ready on every node: runtime detection is blind there'
  - id: node-logs-down
    title: Node security log shipping broken
    pillar: device
    severity: ticket
    attack: [T1562.002]
    for: 15m
    expr: 'max by (namespace, daemonset) (kube_daemonset_status_desired_number_scheduled{daemonset="node-logs"} - kube_daemonset_status_number_ready{daemonset="node-logs"}) > 0 or absent(kube_daemonset_status_number_ready{daemonset="node-logs"}) or sum by (namespace) (increase(loki_write_dropped_entries_total{pod=~"node-logs-.*"}[30m])) > 0'
    summary: 'Audit / auth logs of a node are not reaching the log store (not ready, or entries dropped)'
