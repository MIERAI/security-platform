# Falco content (component `detections`): the curated rules as a ConfigMap (mount it into Falco's rules.d) and the
# in-cluster backstop alerts on Falco's own metrics (prometheus-rules.yaml, generated by ../render.py). Falco itself
# comes from its official chart in the instance (version, driver, resources); see docs/detection.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [prometheus-rules.yaml]
generatorOptions: { disableNameSuffixHash: true }   # Falco watches its rules files; the chart mounts this by name
configMapGenerator:
  - name: falco-rules-security-platform
    files: [security-platform.rules.yaml]
