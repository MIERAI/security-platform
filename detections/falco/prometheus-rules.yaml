# generated by security-platform detections 0.1.0 (render.py) from detections/catalog.yaml - do not edit
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: security-detection
  labels:
    app.kubernetes.io/part-of: security-platform
    security-platform/detections-version: 0.1.0
spec:
  groups:
  - name: security-detection.backstop
    rules:
    - alert: SecurityDetectionFalcoCriticalBackstop
      expr: sum by (namespace, rule_name) (increase(falcosecurity_falco_rules_matches_total{priority=~"0|1|2|(?i:emergency|alert|critical)"}[10m])) > 0
      for: 0m
      labels:
        severity: page
        component: security-detection
        detection: falco-critical-backstop
        pillar: device
      annotations:
        summary: 'Falco critical rule {{ $labels.rule_name }} matched (backstop: works without the log store)'
        title: Falco critical event (in-cluster backstop)
        runbook_url: docs/runbooks/falco-critical-backstop.md
    - alert: SecurityDetectionFalcoSensorDown
      expr: max by (namespace, daemonset) (kube_daemonset_status_desired_number_scheduled{daemonset="falco"} - kube_daemonset_status_number_ready{daemonset="falco"}) > 0 or absent(kube_daemonset_status_number_ready{daemonset="falco"})
      for: 15m
      labels:
        severity: ticket
        component: security-detection
        detection: falco-sensor-down
        pillar: device
      annotations:
        summary: 'Falco is not ready on every node: runtime detection is blind there'
        title: Runtime sensor not running on every node
        runbook_url: docs/runbooks/falco-sensor-down.md
        attack: T1562.001
    - alert: SecurityDetectionNodeLogsDown
      expr: max by (namespace, daemonset) (kube_daemonset_status_desired_number_scheduled{daemonset="node-logs"} - kube_daemonset_status_number_ready{daemonset="node-logs"}) > 0 or absent(kube_daemonset_status_number_ready{daemonset="node-logs"})
        or sum by (namespace) (increase(loki_write_dropped_entries_total{pod=~"node-logs-.*"}[30m])) > 0
      for: 15m
      labels:
        severity: ticket
        component: security-detection
        detection: node-logs-down
        pillar: device
      annotations:
        summary: Audit / auth logs of a node are not reaching the log store (not ready, or entries dropped)
        title: Node security log shipping broken
        runbook_url: docs/runbooks/node-logs-down.md
        attack: T1562.002
