# generated by security-platform detections 0.2.1 (render.py) from detections/catalog.yaml - do not edit
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: security-detection
  labels:
    app.kubernetes.io/part-of: security-platform
    security-platform/detections-version: 0.2.1
spec:
  groups:
  - name: security-detection.backstop
    rules:
    - alert: SecurityDetectionFalcoSensorDown
      expr: max by (namespace, daemonset) (kube_daemonset_status_desired_number_scheduled{daemonset="falco"} - kube_daemonset_status_number_ready{daemonset="falco"}) > 0 or absent(kube_daemonset_status_number_ready{daemonset="falco"})
      for: 15m
      labels:
        severity: ticket
        component: security-detection
        detection: falco-sensor-down
        pillar: device
      annotations:
        summary: 'Falco is not ready on every node: runtime detection is blind there'
        title: Runtime sensor not running on every node
        runbook_url: docs/runbooks/falco-sensor-down.md
        attack: T1562.001
    - alert: SecurityDetectionNodeLogsDown
      expr: max by (namespace, daemonset) (kube_daemonset_status_desired_number_scheduled{daemonset="node-logs"} - kube_daemonset_status_number_ready{daemonset="node-logs"}) > 0 or absent(kube_daemonset_status_number_ready{daemonset="node-logs"})
        or sum by (namespace) (increase(loki_write_dropped_entries_total{pod=~"node-logs-.*"}[30m])) > 0
      for: 15m
      labels:
        severity: ticket
        component: security-detection
        detection: node-logs-down
        pillar: device
      annotations:
        summary: Audit / auth logs of a node are not reaching the log store (not ready, or entries dropped)
        title: Node security log shipping broken
        runbook_url: docs/runbooks/node-logs-down.md
        attack: T1562.002
    - alert: SecurityDetectionFalcoShellInContainer
      expr: sum by (namespace, rule_name) (increase(falcosecurity_falco_rules_matches_total{rule_name=~"Terminal shell in container"}[5m])) > 0 or (sum by (namespace, rule_name) (falcosecurity_falco_rules_matches_total{rule_name=~"Terminal
        shell in container"}) unless sum by (namespace, rule_name) (falcosecurity_falco_rules_matches_total{rule_name=~"Terminal shell in container"} offset 5m))
      for: 0m
      labels:
        severity: ticket
        component: security-detection
        detection: falco-shell-in-container
        pillar: device
        engine: falco-metrics
      annotations:
        summary: 'Interactive shell in a container: Falco rule {{ $labels.rule_name }} matched (in-cluster; details in the log store)'
        title: Interactive shell in a container
        runbook_url: docs/runbooks/falco-shell-in-container.md
        attack: T1059, T1609
    - alert: SecurityDetectionFalcoUnexpectedOutbound
      expr: sum by (namespace, rule_name) (increase(falcosecurity_falco_rules_matches_total{rule_name=~"SP Unexpected outbound connection from container"}[5m])) > 0 or (sum by (namespace, rule_name) (falcosecurity_falco_rules_matches_total{rule_name=~"SP
        Unexpected outbound connection from container"}) unless sum by (namespace, rule_name) (falcosecurity_falco_rules_matches_total{rule_name=~"SP Unexpected outbound connection from container"} offset
        5m))
      for: 0m
      labels:
        severity: ticket
        component: security-detection
        detection: falco-unexpected-outbound
        pillar: network
        engine: falco-metrics
      annotations:
        summary: 'Unexpected outbound connection from a container: Falco rule {{ $labels.rule_name }} matched (in-cluster; details in the log store)'
        title: Unexpected outbound connection from a container
        runbook_url: docs/runbooks/falco-unexpected-outbound.md
        attack: T1041, T1071
    - alert: SecurityDetectionFalcoSensitiveFileRead
      expr: sum by (namespace, rule_name) (increase(falcosecurity_falco_rules_matches_total{rule_name=~"Read sensitive file untrusted|Search Private Keys or Passwords"}[5m])) > 0 or (sum by (namespace,
        rule_name) (falcosecurity_falco_rules_matches_total{rule_name=~"Read sensitive file untrusted|Search Private Keys or Passwords"}) unless sum by (namespace, rule_name) (falcosecurity_falco_rules_matches_total{rule_name=~"Read
        sensitive file untrusted|Search Private Keys or Passwords"} offset 5m))
      for: 0m
      labels:
        severity: ticket
        component: security-detection
        detection: falco-sensitive-file-read
        pillar: device
        engine: falco-metrics
      annotations:
        summary: 'Sensitive file read or credential search: Falco rule {{ $labels.rule_name }} matched (in-cluster; details in the log store)'
        title: Sensitive file read or credential search
        runbook_url: docs/runbooks/falco-sensitive-file-read.md
        attack: T1003.008, T1552.001
    - alert: SecurityDetectionFalcoPrivilegeEscalation
      expr: sum by (namespace, rule_name) (increase(falcosecurity_falco_rules_matches_total{rule_name=~"SP Privilege escalation tool in container|SP Setuid or setgid bit set|PTRACE attached to process|Linux
        Kernel Module Injection Detected|Detect release_agent File Container Escapes"}[5m])) > 0 or (sum by (namespace, rule_name) (falcosecurity_falco_rules_matches_total{rule_name=~"SP Privilege escalation
        tool in container|SP Setuid or setgid bit set|PTRACE attached to process|Linux Kernel Module Injection Detected|Detect release_agent File Container Escapes"}) unless sum by (namespace, rule_name)
        (falcosecurity_falco_rules_matches_total{rule_name=~"SP Privilege escalation tool in container|SP Setuid or setgid bit set|PTRACE attached to process|Linux Kernel Module Injection Detected|Detect
        release_agent File Container Escapes"} offset 5m))
      for: 0m
      labels:
        severity: page
        component: security-detection
        detection: falco-privilege-escalation
        pillar: device
        engine: falco-metrics
      annotations:
        summary: 'Privilege escalation or container escape attempt: Falco rule {{ $labels.rule_name }} matched (in-cluster; details in the log store)'
        title: Privilege escalation or container escape attempt
        runbook_url: docs/runbooks/falco-privilege-escalation.md
        attack: T1548, T1611, T1055.008, T1547.006
    - alert: SecurityDetectionFalcoCryptoMiner
      expr: sum by (namespace, rule_name) (increase(falcosecurity_falco_rules_matches_total{rule_name=~"SP Crypto miner activity"}[5m])) > 0 or (sum by (namespace, rule_name) (falcosecurity_falco_rules_matches_total{rule_name=~"SP
        Crypto miner activity"}) unless sum by (namespace, rule_name) (falcosecurity_falco_rules_matches_total{rule_name=~"SP Crypto miner activity"} offset 5m))
      for: 0m
      labels:
        severity: page
        component: security-detection
        detection: falco-crypto-miner
        pillar: device
        engine: falco-metrics
      annotations:
        summary: 'Crypto miner activity: Falco rule {{ $labels.rule_name }} matched (in-cluster; details in the log store)'
        title: Crypto miner activity
        runbook_url: docs/runbooks/falco-crypto-miner.md
        attack: T1496
    - alert: SecurityDetectionFalcoWriteBelowEtc
      expr: sum by (namespace, rule_name) (increase(falcosecurity_falco_rules_matches_total{rule_name=~"SP Write below etc in container"}[5m])) > 0 or (sum by (namespace, rule_name) (falcosecurity_falco_rules_matches_total{rule_name=~"SP
        Write below etc in container"}) unless sum by (namespace, rule_name) (falcosecurity_falco_rules_matches_total{rule_name=~"SP Write below etc in container"} offset 5m))
      for: 0m
      labels:
        severity: ticket
        component: security-detection
        detection: falco-write-below-etc
        pillar: device
        engine: falco-metrics
      annotations:
        summary: 'Write below /etc in a running container: Falco rule {{ $labels.rule_name }} matched (in-cluster; details in the log store)'
        title: Write below /etc in a running container
        runbook_url: docs/runbooks/falco-write-below-etc.md
        attack: T1543, T1222
    - alert: SecurityDetectionFalcoDropAndExecute
      expr: sum by (namespace, rule_name) (increase(falcosecurity_falco_rules_matches_total{rule_name=~"Drop and execute new binary in container|Fileless execution via memfd_create|Execution from /dev/shm"}[5m]))
        > 0 or (sum by (namespace, rule_name) (falcosecurity_falco_rules_matches_total{rule_name=~"Drop and execute new binary in container|Fileless execution via memfd_create|Execution from /dev/shm"})
        unless sum by (namespace, rule_name) (falcosecurity_falco_rules_matches_total{rule_name=~"Drop and execute new binary in container|Fileless execution via memfd_create|Execution from /dev/shm"} offset
        5m))
      for: 0m
      labels:
        severity: page
        component: security-detection
        detection: falco-drop-and-execute
        pillar: device
        engine: falco-metrics
      annotations:
        summary: 'New or fileless binary executed in a container: Falco rule {{ $labels.rule_name }} matched (in-cluster; details in the log store)'
        title: New or fileless binary executed in a container
        runbook_url: docs/runbooks/falco-drop-and-execute.md
        attack: T1105, T1620
    - alert: SecurityDetectionFalcoReverseShell
      expr: sum by (namespace, rule_name) (increase(falcosecurity_falco_rules_matches_total{rule_name=~"Redirect STDOUT/STDIN to Network Connection in Container|Netcat Remote Code Execution in Container"}[5m]))
        > 0 or (sum by (namespace, rule_name) (falcosecurity_falco_rules_matches_total{rule_name=~"Redirect STDOUT/STDIN to Network Connection in Container|Netcat Remote Code Execution in Container"}) unless
        sum by (namespace, rule_name) (falcosecurity_falco_rules_matches_total{rule_name=~"Redirect STDOUT/STDIN to Network Connection in Container|Netcat Remote Code Execution in Container"} offset 5m))
      for: 0m
      labels:
        severity: page
        component: security-detection
        detection: falco-reverse-shell
        pillar: network
        engine: falco-metrics
      annotations:
        summary: 'Reverse shell pattern: Falco rule {{ $labels.rule_name }} matched (in-cluster; details in the log store)'
        title: Reverse shell pattern
        runbook_url: docs/runbooks/falco-reverse-shell.md
        attack: T1059.004, T1095
    - alert: SecurityDetectionFalcoLogTampering
      expr: sum by (namespace, rule_name) (increase(falcosecurity_falco_rules_matches_total{rule_name=~"Clear Log Activities"}[5m])) > 0 or (sum by (namespace, rule_name) (falcosecurity_falco_rules_matches_total{rule_name=~"Clear
        Log Activities"}) unless sum by (namespace, rule_name) (falcosecurity_falco_rules_matches_total{rule_name=~"Clear Log Activities"} offset 5m))
      for: 0m
      labels:
        severity: ticket
        component: security-detection
        detection: falco-log-tampering
        pillar: device
        engine: falco-metrics
      annotations:
        summary: 'Log files cleared: Falco rule {{ $labels.rule_name }} matched (in-cluster; details in the log store)'
        title: Log files cleared
        runbook_url: docs/runbooks/falco-log-tampering.md
        attack: T1070.002
    - alert: SecurityDetectionFalcoAuthorizedKeysModified
      expr: sum by (namespace, rule_name) (increase(falcosecurity_falco_rules_matches_total{rule_name=~"SP Authorized keys modified"}[5m])) > 0 or (sum by (namespace, rule_name) (falcosecurity_falco_rules_matches_total{rule_name=~"SP
        Authorized keys modified"}) unless sum by (namespace, rule_name) (falcosecurity_falco_rules_matches_total{rule_name=~"SP Authorized keys modified"} offset 5m))
      for: 0m
      labels:
        severity: page
        component: security-detection
        detection: falco-authorized-keys-modified
        pillar: device
        engine: falco-metrics
      annotations:
        summary: 'SSH authorized keys or sshd configuration written (cluster node or container): Falco rule {{ $labels.rule_name }} matched (in-cluster; details in the log store)'
        title: SSH authorized keys or sshd configuration written (cluster node or container)
        runbook_url: docs/runbooks/falco-authorized-keys-modified.md
        attack: T1098.004
