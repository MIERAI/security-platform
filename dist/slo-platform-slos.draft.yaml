app: security-platform
env: <instance>
note: DRAFT for slo-platform (do not deploy in phase 0)
slos:
- name: security-collectors-fresh
  objective: 99
  description: every collector ran in the last 26h
  severities:
    fastBurn: ticket
    mediumBurn: ticket
  age:
    metric: security_collector_last_run_timestamp_seconds
    matchers: ''
    max: 26h
- name: security-ledger-fresh
  objective: 99
  description: ledger updated in the last 26h
  severities:
    fastBurn: ticket
    mediumBurn: ticket
  age:
    metric: security_ledger_last_update_timestamp_seconds
    matchers: ''
    max: 26h
requested_slo_platform_feature:
  type: threshold
  why: security SLIs are gauges that must stay <= N (e.g. unauth services = 0)
  proposed:
    unauth_network_services:
      metric: security_sli{sli="unauth_network_services"}
      max: 0
    ssh_password_auth_hosts:
      metric: security_sli{sli="ssh_password_auth_hosts"}
      max: 0
    oldest_fixable_critical_cve_days:
      metric: security_sli{sli="oldest_fixable_critical_cve_days"}
      max: 30
    kev_affecting_assets:
      metric: security_sli{sli="kev_affecting_assets"}
      max: 0
    kev_or_critical_exposed:
      metric: security_sli{sli="kev_or_critical_exposed"}
      max: 0
    secrets_older_than_90d:
      metric: security_sli{sli="secrets_older_than_90d"}
      max: 0
    public_repos_without_protection:
      metric: security_sli{sli="public_repos_without_protection"}
      max: 0
    critical_open_findings:
      metric: security_sli{sli="critical_open_findings"}
      max: 0
    collector_coverage_gaps:
      metric: security_sli{sli="collector_coverage_gaps"}
      max: 0
    check_catalog_age_days:
      metric: security_sli{sli="check_catalog_age_days"}
      max: 90
