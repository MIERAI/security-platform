# generated by security-platform generators 0.2.0 from generators/sli-catalog.yaml - do not edit
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: security-platform
  labels:
    app.kubernetes.io/part-of: security-platform
    security-platform/generator-version: 0.2.0
spec:
  groups:
  - name: security-platform.regressions
    rules:
    - alert: SecurityRegression_unauth_network_services
      expr: sum by (namespace) (increase(security_sli_new_total{sli="unauth_network_services"}[3h])) > 0
      for: 0m
      labels:
        component: security-platform
        severity: page
        sli: unauth_network_services
      annotations:
        summary: A new sensitive service answers without authentication
        runbook_url: docs/runbooks.md#regression
        description: Sensitive services that answer without authentication from the external vantage point. Details only in the private ledger
          / digest.
    - alert: SecurityRegression_ssh_password_auth_hosts
      expr: sum by (namespace) (increase(security_sli_new_total{sli="ssh_password_auth_hosts"}[3h])) > 0
      for: 0m
      labels:
        component: security-platform
        severity: ticket
        sli: ssh_password_auth_hosts
      annotations:
        summary: A host started accepting SSH passwords
        runbook_url: docs/runbooks.md#regression
        description: Hosts whose SSH server accepts passwords. Details only in the private ledger / digest.
    - alert: SecurityRegression_vuln_alertable
      expr: sum by (namespace) (increase(security_sli_new_total{sli="vuln_alertable"}[3h])) > 0
      for: 0m
      labels:
        component: security-platform
        severity: page
        sli: vuln_alertable
      annotations:
        summary: New KEV match, or a critical vulnerability on an exposed asset
        runbook_url: docs/runbooks.md#regression
        description: Vulnerabilities that affect our assets AND (are in CISA KEV OR are critical on an exposed asset) - the only vulnerability
          class that pages. Details only in the private ledger / digest.
    - alert: SecurityRegression_critical_config_findings
      expr: sum by (namespace) (increase(security_sli_new_total{sli="critical_config_findings"}[3h])) > 0
      for: 0m
      labels:
        component: security-platform
        severity: ticket
        sli: critical_config_findings
      annotations:
        summary: The count of critical (non-vulnerability) findings went up
        runbook_url: docs/runbooks.md#regression
        description: Open critical findings that are not vulnerabilities (configuration, exposure, identity, secrets, agents). Details only in
          the private ledger / digest.
    - alert: SecurityFindingRegression
      expr: sum by (namespace) (increase(security_findings_reopened_total[3h])) > 0
      for: 0m
      labels:
        component: security-platform
        severity: ticket
      annotations:
        summary: 'A fixed security finding came back (regression): write a postmortem'
        runbook_url: docs/runbooks.md#regression
  - name: security-platform.health
    rules:
    - alert: SecurityCollectorStale
      expr: time() - max by (namespace, collector) (security_collector_last_good_run_timestamp_seconds) > 2 * max by (namespace, collector) (security_collector_expected_interval_seconds)
        + 3600
      for: 30m
      labels:
        component: security-platform
        severity: ticket
      annotations:
        summary: 'Collector {{ $labels.collector }} has not covered anything for 2 intervals: no findings != secure'
        runbook_url: docs/runbooks.md#collector-stale
    - alert: SecurityLedgerStale
      expr: time() - max by (namespace) (security_ledger_last_update_timestamp_seconds) > 2 * 86400
      for: 1h
      labels:
        component: security-platform
        severity: ticket
      annotations:
        summary: The security ledger has not been updated for 2 days (hub down?)
        runbook_url: docs/runbooks.md#collector-stale
    - alert: SecurityContractViolation
      expr: max by (namespace) (security_contract_invalid_documents) > 0
      for: 0m
      labels:
        component: security-platform
        severity: ticket
      annotations:
        summary: A collector emitted a findings document that fails the schema (it was ignored)
        runbook_url: docs/runbooks.md#contract-violation
    - alert: SecurityIntelFeedStale
      expr: max by (namespace, feed) (security_intel_feed_age_seconds) > 3 * 86400
      for: 1h
      labels:
        component: security-platform
        severity: ticket
      annotations:
        summary: Threat-intel feed {{ $labels.feed }} older than 3 days
        runbook_url: docs/runbooks.md#intel-feed-stale
    - alert: SecurityExceptionExpired
      expr: max by (namespace) (security_exceptions_expired) > 0
      for: 0m
      labels:
        component: security-platform
        severity: ticket
      annotations:
        summary: 'A risk acceptance expired; the finding is open again: renew (human) or fix'
        runbook_url: docs/runbooks.md#exception-expired
