apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-platform-metrics
  labels: { app.kubernetes.io/name: security-platform-metrics }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: { matchLabels: { app.kubernetes.io/name: security-platform-metrics } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: security-platform-metrics }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: exporter
          image: security-platform
          args: ["serve-metrics", "--dir", "/metrics", "--port", "9851"]
          ports: [{ name: metrics, containerPort: 9851 }]
          readinessProbe: { httpGet: { path: /ready, port: metrics }, periodSeconds: 20 }
          livenessProbe: { httpGet: { path: /healthz, port: metrics }, periodSeconds: 60 }
          resources:
            requests: { cpu: 5m, memory: 24Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: metrics, mountPath: /metrics, readOnly: true }]
      volumes:
        - name: metrics
          configMap: { name: security-platform-metrics, optional: true }   # written by the hub, not by Git
---
apiVersion: v1
kind: Service
metadata:
  name: security-platform-metrics
  labels: { app.kubernetes.io/name: security-platform-metrics }
spec:
  selector: { app.kubernetes.io/name: security-platform-metrics }
  ports: [{ name: metrics, port: 9851, targetPort: metrics }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: security-platform-metrics
spec:
  selector: { matchLabels: { app.kubernetes.io/name: security-platform-metrics } }
  endpoints: [{ port: metrics, interval: 60s, scrapeTimeout: 20s }]
---
# Only the monitoring namespace may scrape; the exporter needs no egress at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: security-platform-metrics
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: security-platform-metrics } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]
      ports: [{ port: 9851 }]
  egress: []
