apiVersion: v1
kind: ServiceAccount
metadata: { name: security-platform-site }
automountServiceAccountToken: false
---
# read-only posture: no secrets, no exec, no writes outside its own outbox
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: security-platform-site-read }
rules:
  - { apiGroups: [""], resources: [namespaces, pods, services], verbs: [get, list] }
  - { apiGroups: [networking.k8s.io], resources: [networkpolicies], verbs: [get, list] }
  - { apiGroups: [rbac.authorization.k8s.io], resources: [roles, rolebindings, clusterroles, clusterrolebindings], verbs: [get, list] }
  - { apiGroups: [wgpolicyk8s.io], resources: [policyreports, clusterpolicyreports], verbs: [get, list] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: security-platform-site-read }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: security-platform-site-read }
subjects: [{ kind: ServiceAccount, name: security-platform-site, namespace: default }]   # kustomize sets the overlay namespace (it only rewrites "default" or empty)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: security-platform-site-outbox }
rules:
  - { apiGroups: [""], resources: [secrets], verbs: [create] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: security-platform-site-outbox }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: security-platform-site-outbox }
subjects: [{ kind: ServiceAccount, name: security-platform-site }]
