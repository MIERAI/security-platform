apiVersion: batch/v1
kind: CronJob
metadata: { name: security-platform-k8s }
spec:
  schedule: "45 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 10800
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 2700
      ttlSecondsAfterFinished: 86400
      template:
        metadata: { labels: { app.kubernetes.io/name: security-platform-site } }
        spec:
          serviceAccountName: security-platform-site
          automountServiceAccountToken: true
          restartPolicy: Never
          enableServiceLinks: false
          securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: runner
              image: security-platform
              args: ["run", "k8s", "--instance", "/config/site.json", "--data", "/data"]
              resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              volumeMounts:
                - { name: config, mountPath: /config, readOnly: true }
                - { name: data, mountPath: /data }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - { name: config, configMap: { name: security-platform-site } }
            - { name: data, emptyDir: { sizeLimit: 256Mi } }
            - { name: tmp, emptyDir: { sizeLimit: 64Mi } }
