# The hub accepts no connections and talks only to the Kubernetes API (inbox, metrics, snapshot, read-only posture)
# and DNS. Sites reach the inbox through the API server, never the pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: security-platform-hub }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: security-platform-hub } }
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - ports: [{ port: 443, protocol: TCP }, { port: 6443, protocol: TCP }]
